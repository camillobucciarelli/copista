name: Build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  # Pull request: runner ospitato da GitHub, sola lettura. Il runner self-hosted
  # (chiavi di firma, chiave App Store Connect) non esegue mai codice delle PR.
  test:
    if: github.event_name == 'pull_request'
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - run: ./test.sh
      - run: ./build.sh
  build:
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v7
      - run: ./test.sh
      - run: ./build.sh
      - run: ditto -c -k --keepParent build/Copista.app Copista.zip
      - uses: actions/upload-artifact@v7
        with:
          name: Copista
          path: Copista.zip
      - if: startsWith(github.ref, 'refs/tags/v')
        run: gh release create "$GITHUB_REF_NAME" Copista.zip --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
  appstore:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v7
      - run: ./appstore.sh
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
