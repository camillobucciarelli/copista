name: Site
# The website (home, support and privacy pages, site/) lives in an R2 bucket behind a custom domain, like the
# sites of postino and custode. R2's custom domain serves no directory index, so every link names its
# file (index.html, support.html, privacy.html); the root `/` is served by a Cloudflare Transform Rule (Rewrite URL:
# path exactly `/` -> static `/index.html`) set by hand in the dashboard.
on:
  push:
    branches: [main]
    paths: ['site/**', 'tool/r2_upload.sh', '.github/workflows/site.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency: site
jobs:
  site:
    # GitHub-hosted: the upload needs only curl, so it does not depend on the self-hosted Mac.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Upload the website to R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          # Public base of the bucket (custom domain), a repository variable; optional.
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
        run: |
          for name in R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_ACCOUNT_ID R2_BUCKET; do
            test -n "${!name}" || { echo "::error::Secret $name is not set"; exit 1; }
          done
          upload() { tool/r2_upload.sh "site/$1" "$1" "$2" "${3:-public, max-age=300}"; }
          # Every file under site/ is uploaded, keyed by its path relative to site/ (subfolders included).
          ctype() {
            case "$1" in
              *.html) echo 'text/html; charset=utf-8' ;;
              *.css) echo 'text/css; charset=utf-8' ;;
              *.txt) echo 'text/plain; charset=utf-8' ;;
              *.woff2) echo font/woff2 ;;
              *.png) echo image/png ;;
              *.jpg|*.jpeg) echo image/jpeg ;;
              *.webp) echo image/webp ;;
              *.svg) echo image/svg+xml ;;
              *) echo "::error::No content type for $1" >&2; return 1 ;;
            esac
          }
          # The pages go last, so they never name a file that is not there yet.
          while IFS= read -r file; do
            key=${file#site/}
            # A font never changes under the same name: a year of cache.
            case "$key" in
              fonts/*.woff2) upload "$key" "$(ctype "$key")" 'public, max-age=31536000, immutable' ;;
              *) upload "$key" "$(ctype "$key")" ;;
            esac
          done < <(find site -type f ! -name '*.html' | sort)
          while IFS= read -r file; do
            key=${file#site/}
            upload "$key" "$(ctype "$key")"
            echo "- ${SITE_BASE_URL:+${SITE_BASE_URL%/}/}$key" >> "$GITHUB_STEP_SUMMARY"
          done < <(find site -type f -name '*.html' | sort)
